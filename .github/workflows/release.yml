name: Update Latest Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date and time
        id: datetime
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Create archive of subtitles
        run: |
          zip -r mk_conquest_subtitles.zip "Mortal Kombat - Conquest" -i "*.srt"

      - name: Prepare Release Notes
        run: |
          cat > release_notes.md <<'EOF'
          Актуальная версия русских субтитров ко всем 22 сериям Mortal Kombat: Conquest.

          - Формат: SRT
          - Кодировка: UTF-8 без BOM
          - Архив содержит только файлы субтитров

          Полное описание и обратная связь: https://github.com/vdistortion/mk-conquest-subtitles#readme
          EOF

      - name: Point latest source tag to this commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = 'tags/latest'
            const owner = context.repo.owner
            const repo = context.repo.repo

            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref,
                sha: context.sha,
                force: true,
              })
            } catch (error) {
              if (error.status !== 404) throw error

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              })
            }

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest mk_conquest_subtitles.zip --clobber
            gh release edit latest \
              --title "Актуальная версия: ${{ steps.datetime.outputs.now }}" \
              --notes-file release_notes.md
          else
            gh release create latest \
              --title "Актуальная версия: ${{ steps.datetime.outputs.now }}" \
              --notes-file release_notes.md \
              --target main \
              mk_conquest_subtitles.zip
          fi
